[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "saman-mobillet"
version = "0.1.0"
description = "Typed sync and async Python clients for the Saman Mobillet HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "APIBANK contributors"}]
keywords = ["saman", "mobillet", "banking", "api", "client", "iran"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28.1,<1"]

[project.urls]
Documentation = "https://apibank.heydari.workers.dev/saman/"

[project.scripts]
saman-mobillet = "saman_mobillet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/saman_mobillet"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "tools/", "docs/", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
