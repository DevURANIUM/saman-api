name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
      - run: python -m pip install -e ./python build twine ruff mypy pip-audit
      - run: python -m ruff check python/src --select E9,F63,F7,F82
      - run: python -m mypy python/src/saman_mobillet python/tests/typing_contract.py --check-untyped-defs --warn-unused-ignores
      - run: python -m unittest discover -s python/tests -v
      - run: python python/tools/audit_runtime.py
      - name: Verify generated async module
        run: python python/tools/check_generated.py
      - run: python -m build python --outdir dist
      - run: python -m twine check dist/*
      - name: Verify wheel installation
        shell: bash
        run: |
          python -m venv .verify-venv
          if [ -x .verify-venv/bin/python ]; then PY=.verify-venv/bin/python; else PY=.verify-venv/Scripts/python.exe; fi
          "$PY" -m pip install dist/*.whl
          "$PY" -m saman_mobillet --help
