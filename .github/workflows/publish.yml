name: Publish Python package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed package version (must match pyproject.toml)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate selected version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python -c "import os,tomllib; assert tomllib.load(open('python/pyproject.toml','rb'))['project']['version'] == os.environ['RELEASE_VERSION']"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
      - run: python -m pip install -e ./python build twine ruff mypy pip-audit
      - run: python -m ruff check python/src --select E9,F63,F7,F82
      - run: python -m mypy python/src/samanapi python/tests/typing_contract.py --check-untyped-defs --warn-unused-ignores
      - run: python -m unittest discover -s python/tests -v
      - run: python python/tools/check_generated.py
      - run: python python/tools/audit_runtime.py
      - run: python -m build python --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/saman-api/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
